# Local PostgreSQL for development: docker compose up -d db
# Listens on localhost:5433 (not the usual 5432) so it never clashes with a PostgreSQL installed on your laptop.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: egyptora
      POSTGRES_PASSWORD: egyptora
      POSTGRES_DB: egyptora
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egyptora"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
